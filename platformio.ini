; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_4mb_debug
lib_dir = lib

[common]
framework           = arduino
; Pinned: Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7). Newer platforms ship Arduino core 3.x,
; whose timer/ADC/BLE API changes break the build
platform            = espressif32@6.13.0
board               = esp32doit-devkit-v1

lib_ldf_mode        = deep+
lib_deps            =
    https://github.com/Erriez/ErriezDS3231
    https://github.com/2dom/PxMatrix.git
    https://github.com/golyakoff/TetrisAnimation.git
    h2zero/NimBLE-Arduino@2.5.1
lib_ignore          =

build_unflags       = -Werror=reorder
build_flags         = -O2
                      -D CONFIG_ARDUINO_ISR_IRAM=1
                      -D CONFIG_BT_ENABLED=1
                      -D CORE_DEBUG_LEVEL=1
                      -D CONFIG_LOG_DEFAULT_LEVEL=1
                      -D LOG_LOCAL_LEVEL=ESP_LOG_ERROR

; NimBLE-Arduino: peripheral only, one connection. The host task runs the GATT write callbacks,
; and the OTA control ones (ota_end()) need more than the default 4 KB of stack.
nimble_flags        = -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
                      -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
                      -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
                      -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=515
                      -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

monitor_speed       = 115200
monitor_filters     = --quiet
                      --echo
                      --eol
                        LF
                      --filter
                        time

upload_speed        = 921600
upload_protocol     = esptool
upload_port         = COM4

[env:esp32_4mb]
framework           = ${common.framework}
platform            = ${common.platform}
board               = ${common.board}

board_build.f_cpu    = 240000000L
board_build.f_flash  = 80000000L
board_build.flash_mode    = dio
board_build.partitions    = ./partitions/4MB.csv
board_upload.flash_size   = 4MB
board_upload.maximum_size = 1966080 ; partition size 1E0000 = 1920 KB

build_unflags       = ${common.build_unflags}
build_flags         = ${common.build_flags}
                      ${common.nimble_flags}
                      -D MC_FLASH_MB=4

monitor_speed       = ${common.monitor_speed}
monitor_filters     = esp32_exception_decoder
                      ${common.monitor_filters}

lib_deps            = ${common.lib_deps}
lib_ignore          = ${common.lib_ignore}
lib_ldf_mode        = ${common.lib_ldf_mode}

upload_protocol     = ${common.upload_protocol}
upload_speed        = ${common.upload_speed}
upload_port         = ${common.upload_port}

[env:esp32_4mb_debug]
extends             = env:esp32_4mb
build_type          = debug
build_flags         = -Og
                      -g
                      ${common.nimble_flags}
                      -D MC_FLASH_MB=4
                      -D DEBUG
                      -D PLATFORMIO_DEBUG
                      -D CORE_DEBUG_LEVEL=4
                      -D CONFIG_LOG_DEFAULT_LEVEL=4
                      -D LOG_LOCAL_LEVEL=ESP_LOG_DEBUG

[env:esp32_16mb]
framework           = ${common.framework}
platform            = ${common.platform}
board               = ${common.board}

board_build.f_cpu    = 240000000L
board_build.f_flash  = 80000000L
board_build.flash_mode    = dio
board_build.partitions    = ./partitions/16MB.csv
board_upload.flash_size   = 16MB
board_upload.maximum_size = 8257536 ; partition size 7E0000 = 8064 KB

build_unflags       = ${common.build_unflags}
build_flags         = ${common.build_flags}
                      ${common.nimble_flags}
                      -D MC_FLASH_MB=16

monitor_speed       = ${common.monitor_speed}
monitor_filters     = esp32_exception_decoder
                      ${common.monitor_filters}

lib_deps            = ${common.lib_deps}
lib_ignore          = ${common.lib_ignore}
lib_ldf_mode        = ${common.lib_ldf_mode}

upload_protocol     = ${common.upload_protocol}
upload_speed        = ${common.upload_speed}
upload_port         = ${common.upload_port}
