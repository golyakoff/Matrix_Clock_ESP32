name: Firmware Build and Release

# A tag vX.Y.Z publishes a release (the latest one). A tag vX.Y.Z-betaN publishes a beta: a
# pre-release that also carries the debug builds, and its manifest.json is copied to the "beta"
# pre-release, where clocks on the beta update channel look for it (main/include/updater.h).
# tools/release.sh and tools/release_beta.sh set version.txt and make the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Get version from tag
      id: get_version
      run: |
        if [[ "$GITHUB_REF" != refs/tags/* ]]; then
          # a manual run builds and packages version.txt without publishing anything
          TAG="$(head -n1 version.txt | tr -d '\r')"
        else
          TAG="${GITHUB_REF#refs/tags/}"
        fi
        if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta[1-9][0-9]*$ ]]; then
          BETA=true
        elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          BETA=false
        else
          echo "$TAG is neither vX.Y.Z nor vX.Y.Z-betaN"
          exit 1
        fi
        echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
        echo "BETA=$BETA" >> $GITHUB_OUTPUT

    - name: Check the tag matches version.txt
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        test "$(head -n1 version.txt | tr -d '\r')" = "${{ steps.get_version.outputs.TAG_NAME }}" \
          || { echo "version.txt ($(head -n1 version.txt)) does not match the tag"; exit 1; }

    - name: Build all variants
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.6
        target: esp32
        command: >-
          tools/build.sh release_4mb &&
          tools/build.sh release_16mb
          ${{ steps.get_version.outputs.BETA == 'true' && '&& tools/build.sh debug_4mb && tools/build.sh debug_16mb' || '' }}

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install esptool
      run: pip install "esptool>=5,<6"

    - name: Package release assets and release notes
      run: |
        chmod +x tools/make_release.sh
        tools/make_release.sh "${{ steps.get_version.outputs.TAG_NAME }}"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: ${{ steps.get_version.outputs.BETA == 'true' && 'Beta' || 'Release' }} ${{ steps.get_version.outputs.TAG_NAME }}
        body_path: release_notes.md
        prerelease: ${{ steps.get_version.outputs.BETA == 'true' }}
        make_latest: ${{ steps.get_version.outputs.BETA == 'true' && 'false' || 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Point the beta channel at this beta
      if: startsWith(github.ref, 'refs/tags/') && steps.get_version.outputs.BETA == 'true'
      uses: softprops/action-gh-release@v3
      with:
        files: release/manifest.json
        overwrite_files: true
        tag_name: beta
        name: Beta channel
        body: |
          The beta update channel: `manifest.json` here points at the latest beta,
          [${{ steps.get_version.outputs.TAG_NAME }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.TAG_NAME }}).
          Clocks with the beta channel on (the app's firmware card) read it besides the latest release.
          Updated by CI on every vX.Y.Z-betaN tag; don't delete it or upload anything else here.
        prerelease: true
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
