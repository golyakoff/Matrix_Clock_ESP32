name: Firmware Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pio --version

    - name: Build all environments
      run: |
        pio run -e esp32_4mb_debug  
        pio run -e esp32_4mb        
        pio run -e esp32_16mb

    - name: Get version from tag
      id: get_version
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Install esptool
      run: pip install "esptool>=5,<6"

    - name: Package release assets and release notes
      run: |
        chmod +x tools/make_release.sh
        tools/make_release.sh "${{ steps.get_version.outputs.TAG_NAME }}"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: Release ${{ steps.get_version.outputs.TAG_NAME }}
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
