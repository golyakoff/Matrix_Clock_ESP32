name: Firmware Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build all variants
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.5.6
        target: esp32
        command: >-
          tools/build.sh debug_4mb &&
          tools/build.sh release_4mb &&
          tools/build.sh release_16mb

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Get version from tag
      id: get_version
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Check the tag matches version.txt
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        test "$(head -n1 version.txt)" = "${{ steps.get_version.outputs.TAG_NAME }}" \
          || { echo "version.txt ($(head -n1 version.txt)) does not match the tag"; exit 1; }

    - name: Install esptool
      run: pip install "esptool>=5,<6"

    - name: Package release assets and release notes
      run: |
        chmod +x tools/make_release.sh
        tools/make_release.sh "${{ steps.get_version.outputs.TAG_NAME }}"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: Release ${{ steps.get_version.outputs.TAG_NAME }}
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
